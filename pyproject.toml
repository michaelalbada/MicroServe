[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microserve-llm"
version = "0.1.0"
description = "Modern LLM serving from first principles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.28",
    "psutil>=6",
    "rich>=13.9",
    "safetensors>=0.5",
    "tokenizers>=0.21",
    "torch>=2.2",
]

[project.scripts]
microserve = "microserve.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
